[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vip-channel-management-saas"
version = "0.1.0"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "sqlalchemy>=2.0.0",
    "asyncpg",
    "alembic",
    "psycopg2-binary"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "aiosqlite",   # unit-layer backend
    "asyncpg",     # integration/e2e backend (also a runtime dep)
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: test requires a real PostgreSQL database (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
files = ["app", "tests"]