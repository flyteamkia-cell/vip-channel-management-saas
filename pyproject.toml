[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vip-channel-management-saas"
version = "0.1.0"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "sqlalchemy>=2.0.0",
    "asyncpg",
    "alembic",
    "httpx",        # provider adapters
    "cryptography", # credential encryption at rest (PHASE0 §2)
    "apscheduler",  # in-process scheduling (PHASE0 §31)
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",       # required by starlette.testclient
    "httpx2",      # starlette prefers it when present; silences its deprecation notice
    "aiosqlite",   # unit-layer backend
    "asyncpg",     # integration/e2e backend (also a runtime dep)
]

[tool.setuptools.packages.find]
# Without this, setuptools' flat-layout autodiscovery sees two top-level
# directories (app/ and migrations/) and refuses to guess. Only `app` is the
# distributable package; migrations/ and tests/ are project files, not library
# code, and must never be shipped inside the wheel.
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: test requires a real PostgreSQL database (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are evaluated once at import and are immutable;
# B008 ("function call in argument default") is a false positive for them.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
files = ["app", "tests"]